# Mounts the project root into each Airflow container and injects credentials
# from the parent .env. Run `astro dev start` from the airflow/ directory.
services:
  scheduler:
    env_file: ../.env
    environment:
      DUCKDB_PATH: /usr/local/project/data/catalog_data_platform.duckdb
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ../:/usr/local/project
  webserver:
    env_file: ../.env
    environment:
      DUCKDB_PATH: /usr/local/project/data/catalog_data_platform.duckdb
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ../:/usr/local/project
  triggerer:
    env_file: ../.env
    environment:
      DUCKDB_PATH: /usr/local/project/data/catalog_data_platform.duckdb
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ../:/usr/local/project
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
